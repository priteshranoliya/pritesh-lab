# Folder icons, read by apply.sh. Copy this file to icons.conf (gitignored) and make it yours.
#
#   kind   source              folder colour  [tile=#hex]  folders (names or globs inside ~/Desktop)
#
#   glyph  an SF Symbol name   (browse them in Apple's SF Symbols app)
#   logo   a PNG that fills the tile; use a square logo, e.g. the project's apple-touch-icon
#   mark   a PNG drawn smaller on a coloured tile (set with tile=)
#
# A good source for logos is each project's own favicon / apple-touch-icon. Keep them in logos/ (gitignored).

# Work projects: one brand colour per company or client
logo   logos/acme.png      #23A27E              acme-*
mark   logos/leaf.png      #75BA4B  tile=#FFFCE9  garden-app

# Everything else: a symbol that says what's inside
glyph  book.fill                   #5B5BD6   learning
glyph  briefcase.fill              #475569   work
glyph  photo.on.rectangle.angled   #0EA5E9   docs-and-assets
glyph  cylinder.split.1x2.fill     #D97706   db-backups
glyph  wrench.and.screwdriver.fill #6B7280   local-tools
glyph  paintpalette.fill           #C026D3   design-*
glyph  person.fill                 #0F766E   portfolio
glyph  camera.fill                 #DB2777   Screenshots
